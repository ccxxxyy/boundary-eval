[project]
name = "faultline"
version = "0.1.0"
description = "An eval measuring whether LLMs can write crash-safe, exactly-once business logic"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faultline"]

[tool.pytest.ini_options]
testpaths = ["validation"]
