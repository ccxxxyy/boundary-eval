# Model sets. Build and debug against `dev`, report against `frontier`.
#
# Ids are OpenRouter model slugs. The live catalogue moves, so verify before a
# reporting run:
#   python -m faultline.models_check
#
# Costs below are the listed OpenRouter prices in USD per million tokens at the
# time of writing, kept here only so the README can state an expected spend.

dev:
  - id: deepseek/deepseek-v4-flash
    label: DeepSeek V4 Flash
    note: effectively free ($0.09/$0.18 per M) and far steadier than the :free tier
  - id: openrouter/free
    label: OpenRouter free router
  - id: google/gemma-4-31b-it:free
    label: Gemma 4 31B (free)

frontier:
  - id: anthropic/claude-opus-5.5
    label: Claude Opus 5.5
    reasoning_effort: high
    price: 4/20
  - id: openai/gpt-5.6-sol-pro
    label: GPT-5.6 Sol Pro
    reasoning_effort: high
    price: 4/20
  - id: google/gemini-3.1-pro-preview
    label: Gemini 3.1 Pro
    price: 2/12
  - id: x-ai/grok-4.7
    label: Grok 4.7
    price: 2/6

defaults:
  temperature: 0.0
  max_tokens: 16000
  seeds: [1, 2, 3]
  repair_rounds: 2
